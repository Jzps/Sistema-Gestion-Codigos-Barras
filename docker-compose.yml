# SGCBP - Infraestructura local de desarrollo.
# Solo PostgreSQL: el backend y el frontend se ejecutan localmente (ver README y docs/setup.md).
services:
  db:
    image: postgres:16-alpine
    container_name: sgcbp_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sgcbp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sgcbp}
      POSTGRES_DB: ${POSTGRES_DB:-sgcbp}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
